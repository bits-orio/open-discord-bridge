name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
      - name: bridge — vet / test / build
        working-directory: bridge
        run: |
          go vet ./...
          go test ./...
          go build ./...
      - name: wizard — vet / test / build
        working-directory: wizard
        run: |
          go vet ./...
          go test ./...
          go build ./...
